# English / multilingual mixing experiment: 80/20
#
# Matches openeurollm/Prelude-SFT-Excellent-v0.2 in every respect except the
# mixture, so a difference between the three runs is attributable to the ratio
# and not to the recipe. Reference card:
#   https://huggingface.co/openeurollm/Prelude-SFT-Excellent-v0.2
#
# The ratio is by TOKEN, not by row. Excellent-SFT averages 4457 tokens/row and
# Dolci-Think-translated 8000, so equal row counts would be a 36/64 token split.
# At weight 1.0 the mix is already 74/26 by tokens; the weight below scales the
# multilingual side to hit the target:
#
#     English      6,187,014 rows x 4457 tok = 27.58B
#     Multilingual 1,181,159 rows x 8000 tok =  9.45B   (after filter_pass)
#
#     w = target * en_tokens / ((1 - target) * ml_tokens)
#
#     90/10 -> 0.324     80/20 -> 0.730     70/30 -> 1.251
#
# This config uses 0.73, giving 20% of tokens from the twelve translated
# languages, spread evenly across them.
#
# ONE deliberate deviation from the reference: flash_attention_2 rather than 3.
# FA3 needs Hopper; Leonardo is A100. It changes speed, not results.

method: sft
backend: trl
run_name: prelude-mixing-80-20
offline: false
prefetch_assets: true

container: null                     # bare-metal TRL; see docs/README

model:
  name_or_path: openeurollm/prelude-anneal300b-256k-rope20m-cont
  revision: 47a42eb598c0417691b8054e03dac172241bca6b
  attn_implementation: flash_attention_2
  dtype: bfloat16
  tokenizer_name_or_path: openeurollm/tokenizer-256k
  tokenizer_revision: qwen3-tokens   # == 94bae05cf351c4feb435d6a73c2aa8edfd88ae04

training:
  num_train_epochs: 1   # v0.2 used 2; halved for the ratio sweep
  learning_rate: 8.0e-5
  effective_batch_size: 32
  per_device_train_batch_size: 1
  warmup_steps: 0.03
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.0
  lr_scheduler_type: "linear"
  gradient_checkpointing: true
  bf16: true
  seed: 42
  use_liger_kernel: true

sft:
  max_seq_length: 32768
  packing: true
  # The reference drops rows whose supervised span is cut by the cap, rather
  # than training on a truncated answer. It matters more here: the multilingual
  # rows are twice as long, so `warn` would silently degrade one side of the
  # very comparison this experiment makes.
  truncated_span_action: drop
  dataset_num_proc: 32
  # PR #68. Reasoning rows: half get /think, half get no instruction, so
  # reasoning stays the default. Direct-answer rows always get /no_think, so a
  # bare answer only ever follows an explicit instruction.
  thinking_instruction_probability: 0.5

checkpointing:
  save_steps: 500
  save_total_limit: 3
  inference_checkpoint_steps: 500
  inference_checkpoint_path: "inference_checkpoints"

data:
  chat_template: qwen3              # the PR #68 template, not qwen3-think-control
  num_proc: 32
  seed: 42
  datasets:
    - name: excellent-sft
      path: openeurollm/OpenEuroLLM-Excellent-SFT
      split: train
      weight: 1.0
      transform: strip_to_role_content

    - name: think-cs
      path: openeurollm/Dolci-Think-SFT-translated
      subset: cs
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-de
      path: openeurollm/Dolci-Think-SFT-translated
      subset: de
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-el
      path: openeurollm/Dolci-Think-SFT-translated
      subset: el
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-es
      path: openeurollm/Dolci-Think-SFT-translated
      subset: es
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-fi
      path: openeurollm/Dolci-Think-SFT-translated
      subset: fi
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-fr
      path: openeurollm/Dolci-Think-SFT-translated
      subset: fr
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-it
      path: openeurollm/Dolci-Think-SFT-translated
      subset: it
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-nl
      path: openeurollm/Dolci-Think-SFT-translated
      subset: nl
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-pl
      path: openeurollm/Dolci-Think-SFT-translated
      subset: pl
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-ro
      path: openeurollm/Dolci-Think-SFT-translated
      subset: ro
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-sv
      path: openeurollm/Dolci-Think-SFT-translated
      subset: sv
      split: train
      weight: 0.685
      transform: dolci_think_translated

    - name: think-uk
      path: openeurollm/Dolci-Think-SFT-translated
      subset: uk
      split: train
      weight: 0.685
      transform: dolci_think_translated

deepspeed:
  bf16:
    enabled: auto
  zero_optimization:
    stage: 2
    overlap_comm: false
    contiguous_gradients: true
    reduce_scatter: true
  gradient_clipping: 1.0
  train_micro_batch_size_per_gpu: "auto"
  gradient_accumulation_steps: "auto"
  train_batch_size: "auto"
  optimizer:
    type: AdamW
    params:
      lr: "auto"
      betas: "auto"
      eps: "auto"
      weight_decay: "auto"

accelerate:
  mixed_precision: "bf16"
  use_deepspeed: true
  deepspeed_multinode_launcher: "standard"
  same_network: true
  rdzv_backend: "static"
  dynamo_backend: "inductor"

logging:
  report_to:
    - "tensorboard"
  wandb_project: "prelude-mixing"
  logging_steps: 10
  include_num_input_tokens_seen: "non_padding"

slurm:
  account: "AIFAC_F02_1251"
  partition: "boost_usr_prod"
  num_nodes: 8                      # 8 x 4 A100 = 32 GPUs, matching the reference
  gpus_per_node: 4
  cpus_per_task: 32
  mem: "480G"
  wall_time: "24:00:00"             # requeues itself; verify the QOS ceiling
  job_name: "mix-80-20"
  signal_time_seconds: 300
  max_failures: 3
  modules: ["cuda/12.2"]
  module_purge: false

debug:
  enabled: false
  override_existing: false

paths:
  output_base: "/leonardo_scratch/large/userexternal/nhertzbe/outputs"
  debug_base: "/leonardo_scratch/large/userexternal/nhertzbe/outputs/debug"
